[build-system]
# setuptools>=77 is required for the SPDX `license = "MIT"` expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-dataset"
version = "0.1.0"
description = "Preparation and publication utilities for frozen quantitative datasets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tony Li" }]
requires-python = ">=3.10"
dependencies = [
    "exchange-calendars==4.11.3",
    "numpy",
    "pandas",
    "yfinance==0.2.66",
    "tomli>=2.0; python_version < '3.11'",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
extraction = ["lxml>=5,<7"]
model = ["openai>=1.0,<3"]
filings = ["arelle-release==2.46.0"]
query = ["duckdb==1.5.6"]
# torch is not imported anywhere in src/ or tests/; it is only needed by downstream
# training repos, so it lives behind the `train` extra.
train = ["torch>=2.14.0"]

[project.scripts]
quant-dataset = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"filings._vendor.sec_transforms" = ["UPSTREAM.json", "LICENSE-APACHE-2.0.txt", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/filings/_vendor/sec_transforms"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap `src/` onto sys.path before importing the pipeline modules.
"tests/*" = ["E402"]
# This module embeds human-readable contract strings published verbatim in manifests/reports.
"src/samples/builder.py" = ["E501"]
# organize_financials is an intentional re-export consumed as
# `download.organize.organize_financials` by manager.py and tests; without the F401
# ignore ruff would delete a public attribute.
"src/download/organize.py" = ["E501", "F401"]

[tool.unittest]
test_discovery = "tests"
