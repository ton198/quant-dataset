[build-system]
# setuptools>=77 is required for the SPDX `license = "MIT"` expression (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-dataset"
version = "0.1.0"
description = "Preparation and publication utilities for frozen quantitative datasets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tony Li" }]
requires-python = ">=3.10"
dependencies = [
    "exchange-calendars==4.11.3",
    "numpy",
    "pandas",
    "yfinance==0.2.66",
    "tomli>=2.0; python_version < '3.11'",
    "pyarrow>=25.0.1",
    "lxml>=5,<7",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[project.scripts]
quant-dataset = "cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


[tool.unittest]
test_discovery = "tests"
