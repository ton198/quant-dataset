# Example secrets file. Copy to config/secrets.toml and fill in real values.
# config/secrets.toml is gitignored -- never commit real credentials.
# If a FRED key leaks, rotate it at https://fredaccount.stlouisfed.org/apikeys

[secrets]
fred_api_key = "YOUR_FRED_API_KEY"
sec_user_agent = "Your Name your-email@example.com"
# Financial extraction provider key; environment variables are not used.
api_key = "YOUR_EXTRACTION_API_KEY"
