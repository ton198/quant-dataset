name: 功能请求
description: 提出新能力或流程改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 要解决什么问题？当前做法为什么不够？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 期望的行为、接口或数据契约变化；如涉及 CLI / schema，请说明兼容性影响
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过的其他做法，以及为什么没有选它
    validations:
      required: true
