<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ix="http://www.xbrl.org/2013/inlineXBRL"
      xmlns:xbrli="http://www.xbrl.org/2003/instance"
      xmlns:link="http://www.xbrl.org/2003/linkbase"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      xmlns:iso4217="http://www.xbrl.org/2003/iso4217"
      xmlns:ex="https://example.test/filings">
  <head><title>Small Inline XBRL Fixture</title></head>
  <body>
    <ix:header>
      <ix:references><link:schemaRef xlink:type="simple" xlink:href="issuer.xsd"/></ix:references>
      <ix:resources>
        <xbrli:context id="instant">
          <xbrli:entity><xbrli:identifier scheme="https://example.test/entity">0000123456</xbrli:identifier></xbrli:entity>
          <xbrli:period><xbrli:startDate>2024-01-01</xbrli:startDate><xbrli:endDate>2024-01-02</xbrli:endDate></xbrli:period>
        </xbrli:context>
        <xbrli:unit id="USD"><xbrli:measure>iso4217:USD</xbrli:measure></xbrli:unit>
      </ix:resources>
    </ix:header>
    <p><ix:nonFraction name="ex:Amount" contextRef="instant" unitRef="USD" decimals="0">100</ix:nonFraction></p>
  </body>
</html>
