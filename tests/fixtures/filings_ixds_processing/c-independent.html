<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ix="http://www.xbrl.org/2013/inlineXBRL"
      xmlns:ixt="http://www.xbrl.org/inlineXBRL/transformation/2020-02-12"
      xmlns:xbrli="http://www.xbrl.org/2003/instance"
      xmlns:link="http://www.xbrl.org/2003/linkbase"
      xmlns:xlink="http://www.w3.org/1999/xlink"
      xmlns:ex="https://example.test/ixds"
      xmlns:iso4217="http://www.xbrl.org/2003/iso4217">
  <head><title>Independent inline report</title></head>
  <body>
    <ix:header>
      <ix:references><link:schemaRef xlink:type="simple" xlink:href="taxonomy.xsd"/></ix:references>
      <ix:resources>
        <xbrli:context id="own-context">
          <xbrli:entity><xbrli:identifier scheme="https://example.test/entity">0000654321</xbrli:identifier></xbrli:entity>
          <xbrli:period><xbrli:startDate>2024-01-01</xbrli:startDate><xbrli:endDate>2024-12-31</xbrli:endDate></xbrli:period>
        </xbrli:context>
        <xbrli:unit id="own-usd"><xbrli:measure>iso4217:USD</xbrli:measure></xbrli:unit>
      </ix:resources>
    </ix:header>
    <p><ix:nonFraction id="own-amount" name="ex:Amount" contextRef="own-context" unitRef="own-usd" decimals="0" format="ixt:num-dot-decimal">42</ix:nonFraction></p>
  </body>
</html>
